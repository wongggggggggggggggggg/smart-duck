<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生態科普</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./place_detail.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-pattern"></div>

    <div class="app-shell">
      <header class="window top-bar">
        <a id="backToMap" class="btn ghost" href="./index.html">← 返回地圖</a>
        <button type="button" id="langToggleBtn" class="btn ghost">English</button>
      </header>

      <main class="window detail-card">
        <div class="detail-hero">
          <p class="place-type" id="placeType"></p>
          <h1 id="placeName"></h1>
          <p class="place-summary" id="placeSummary"></p>
          <div class="tag-row" id="placeTags"></div>
        </div>

        <section class="section">
          <h2 id="factsTitle"></h2>
          <div id="factsGrid" class="facts-grid"></div>
        </section>

        <section class="section">
          <h2 id="sectionsTitle"></h2>
          <div id="sectionsList" class="sections-list"></div>
        </section>
      </main>
    </div>

    <script src="./place_detail.js"></script>
  </body>
</html>
