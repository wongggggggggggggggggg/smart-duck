<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>更新中...</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f6faf7;
        color: #1f3b3a;
      }
      .card {
        background: #ffffff;
        border: 1px solid #cfe4db;
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(7, 41, 45, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>正在更新...</h1>
      <p>請稍候，將清除快取並重新載入最新版本。</p>
    </div>
    <script>
      (async () => {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => reg.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        location.replace("./index.html?v=11");
      })();
    </script>
  </body>
</html>
